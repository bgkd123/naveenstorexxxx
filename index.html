<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVEEN STORE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #f8f5f0 0%, #e8e2d9 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }

    .store-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.25),
                  inset 0 1px 4px rgba(255, 255, 255, 0.8);
      text-align: center;
      max-width: 600px;
      width: 100%;
      border: 1px solid rgba(255, 215, 0, 0.3);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 3.2rem;
      letter-spacing: 4px;
      font-weight: 700;
      color: #1f1b16;
      text-shadow: 3px 3px 0 #d4af37, 0 1px 4px rgba(0, 0, 0, 0.1);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .subhead {
      font-size: 1rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #6b5a4b;
      margin-bottom: 3rem;
      font-weight: 400;
      border-bottom: 1px solid #d4af37;
      display: inline-block;
      padding-bottom: 0.75rem;
    }

    .continue-btn {
      background: #d4af37;
      border: none;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 6px;
      padding: 1.2rem 3.5rem;
      border-radius: 60px;
      color: #1e1a16;
      cursor: pointer;
      box-shadow: 0 14px 20px -8px rgba(0, 0, 0, 0.3),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.15),
                  inset 0 2px 10px rgba(255, 255, 240, 0.7);
      transition: all 0.15s ease;
      text-transform: uppercase;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 380px;
    }

    .continue-btn:hover {
      background: #e6c34d;
      transform: scale(1.02);
      box-shadow: 0 18px 24px -8px rgba(0, 0, 0, 0.4),
                  inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                  inset 0 2px 12px #fff8e0;
    }

    .continue-btn:active {
      transform: scale(0.98);
      box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.4),
                  inset 0 4px 8px rgba(0, 0, 0, 0.2);
      background: #c9a634;
    }

    .message-area {
      min-height: 5rem;
      margin-top: 0.8rem;
      font-size: 1.4rem;
      font-weight: 500;
      color: #2b1f16;
      background: rgba(212, 175, 55, 0.1);
      padding: 1.4rem 1.2rem;
      border-radius: 3rem;
      border: 1px dashed #b99b3c;
      transition: all 0.3s ease;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      opacity: 0.95;
    }

    .message-area.highlight {
      background: #fef7e0;
      border: 2px solid #d4af37;
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
      transform: scale(1.01);
      color: #1e160e;
    }

    .message-text {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .emoji-big {
      font-size: 2rem;
      display: inline-block;
      margin-right: 8px;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #9b8b7a;
      text-transform: uppercase;
    }

    /* responsive */
    @media (max-width: 500px) {
      .store-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }
      h1 {
        font-size: 2.4rem;
        letter-spacing: 2px;
      }
      .subhead {
        font-size: 0.8rem;
        letter-spacing: 4px;
      }
      .continue-btn {
        font-size: 1.5rem;
        letter-spacing: 3px;
        padding: 1rem 1.8rem;
      }
      .message-area {
        font-size: 1.2rem;
        padding: 1rem;
      }
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 2rem;
      }
      .continue-btn {
        font-size: 1.2rem;
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="store-card">
    <h1>NAVEEN STORE</h1>
    <div class="subhead">est. 2025</div>

    <!-- CONTINUE BUTTON -->
    <button id="continueBtn" class="continue-btn">CONTINUE</button>

    <!-- MESSAGE AREA -->
    <div id="messageBox" class="message-area">
      <span class="message-text">✨ welcome ✨</span>
    </div>

    <div class="footer-note">thank you for visiting</div>
  </div>

  <script>
    (function() {
      const continueBtn = document.getElementById('continueBtn');
      const messageBox = document.getElementById('messageBox');

      // The exact message you requested (Kannada + English mix)
      // "Messege site under maintenance nale varu" -> 
      // "site under maintenance, naale varu" (meaning: come tomorrow)
      const MAINTENANCE_MESSAGE = '🛠️ site under maintenance — naale varu 🛠️';

      // Add a fun click handler
      continueBtn.addEventListener('click', function() {
        // Update the message box with the maintenance message
        messageBox.innerHTML = `<span class="message-text"><span class="emoji-big">🛠️</span> ${MAINTENANCE_MESSAGE} <span class="emoji-big">🛠️</span></span>`;

        // Add a temporary highlight class for visual feedback
        messageBox.classList.add('highlight');

        // Remove highlight after 1 second (1000ms) – optional smoothness
        setTimeout(() => {
          messageBox.classList.remove('highlight');
        }, 1000);

        // Optional: also change button text to "CHECKED" briefly? No, keep as is.
        // But we can give a little audio-free feedback: button text stays "CONTINUE".
        // Keep the button functional – multiple clicks will just show the message again.
        // If you want to prevent double-highlight conflicts, just re-add class.
      });

      // Also allow pressing the button with "Enter" on keyboard – already works because it's a <button>.
      // Also for fun: if the user clicks again after maintenance message, it stays.
      // No extra steps.

      // Make sure if messageBox has any initial text it's overwritten only on click.
      // Initial state: "✨ welcome ✨" is fine.

      // Optional: pressing 'c' key also triggers? Not necessary. But for dev friendliness maybe.
      // I'll keep it simple as per request.
    })();
  </script>
</body>
</html>
